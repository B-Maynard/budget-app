<div class="app-container">
  <div class="main-content">
    <router-outlet></router-outlet>
    <div class="bottom-spacer"></div>
  </div>

  @if (isAuthenticated) {
  <nav class="bottom-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
      <i class="bx bx-home"></i>
      <span>Dashboard</span>
    </a>
    <a routerLink="/update" routerLinkActive="active" class="nav-item">
      <i class="bx bx-list-ul"></i>
      <span>Bills</span>
    </a>
    <a routerLink="/billtotal" routerLinkActive="active" class="nav-item">
      <i class="bx bx-pie-chart-alt-2"></i>
      <span>Totals</span>
    </a>
    <a routerLink="/transactions" routerLinkActive="active" class="nav-item">
      <i class="bx bx-transfer"></i><span>Transactions</span>
    </a>
    <a routerLink="/debts" routerLinkActive="active" class="nav-item">
      <i class="bx bx-credit-card"></i><span>Debts</span>
    </a>
  </nav>
  }
</div>
