<div class="app-container" [class.mockup-mode]="isMockup">
  @if (!isMockup) {
    <header class="app-header">
      <div class="header-content">
        <a routerLink="/" class="app-brand" aria-label="Current home"
          ><app-icon name="activity" />current<span>.</span></a
        >
        @if (isAuthenticated) {
          <nav class="app-nav" aria-label="Main navigation">
            <a
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              ><app-icon name="home" /><span>Overview</span></a
            >
            <a
              routerLink="/update"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              ><app-icon name="bills" /><span>Bills</span></a
            >
            <a
              routerLink="/billtotal"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              ><app-icon name="wallet" /><span>Totals</span></a
            >
            <a
              routerLink="/transactions"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              ><app-icon name="activity" /><span>Activity</span></a
            >
            <a
              routerLink="/debts"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              ><app-icon name="plan" /><span>Debts</span></a
            >
          </nav>
        }
        <button
          type="button"
          class="theme-toggle"
          (click)="toggleTheme()"
          [attr.aria-label]="
            isDark ? 'Switch to light mode' : 'Switch to dark mode'
          "
          [attr.title]="isDark ? 'Light mode' : 'Dark mode'"
          [attr.aria-pressed]="isDark"
        >
          <app-icon [name]="isDark ? 'sun' : 'moon'" />
        </button>
      </div>
    </header>
  }
  <div class="main-content" [class.has-nav]="isAuthenticated && !isMockup">
    <router-outlet></router-outlet>
  </div>
</div>
